name: "🐾 Animal recogido"
description: Publica la ficha de un animal recogido por el servicio municipal de recogida.
title: "[Animal] "
labels: ["nuevo-animal"]
body:
  - type: markdown
    attributes:
      value: |
        Para animales recogidos por el servicio municipal de recogida de animales (no para
        protectoras ni asociaciones, que gestionan sus propias adopciones por su cuenta).

        Un workflow automático validará estos datos. Si todo está correcto, abrirá un Pull
        Request con la ficha lista para revisión manual antes de publicarse en la web.
        Si falta o falla algo, se comentará aquí mismo qué corregir — solo tienes que editar
        este issue y se revalidará solo.

  - type: input
    id: fecha
    attributes:
      label: Fecha de recogida
      description: Formato AAAA-MM-DD.
      placeholder: "Ej: 2026-09-30"
    validations:
      required: true

  - type: input
    id: lugar
    attributes:
      label: Lugar de recogida
      placeholder: "Ej: Calle Fuenteminaya, Aranda de Duero"
    validations:
      required: true

  - type: input
    id: situacion
    attributes:
      label: Situación
      placeholder: "Ej: En custodia municipal"
    validations:
      required: true

  - type: textarea
    id: descripcion
    attributes:
      label: Descripción (opcional)
      placeholder: "Ej: Gato adulto, buen estado de salud..."
    validations:
      required: false

  - type: textarea
    id: imagen
    attributes:
      label: Foto
      description: >-
        Haz clic aquí dentro y arrastra (o pega) UNA sola foto del animal.
        No subas más fotos en ningún otro campo del formulario: si detectamos más de una, el
        sistema te pedirá que dejes solo una.
    validations:
      required: true
