name: "🗄️ Archivar animal"
description: Retira del listado activo la ficha de un animal que ya no está bajo custodia municipal (adoptado, reclamado, trasladado...).
title: "[Archivar] "
labels: ["archivar-animal"]
body:
  - type: markdown
    attributes:
      value: |
        Para archivar una ficha hace falta su **id**: es `recogida-issue-` seguido del número del
        issue que la publicó (ej. el issue #12 generó el id `recogida-issue-12`; lo ves en la
        URL de ese issue o en el título del Pull Request que lo publicó).

        Esto es manual, no automático: una ficha permanece activa hasta que alguien abre este
        formulario para archivarla.

        Un workflow automático comprobará que ese id existe. Si es correcto, abrirá un Pull
        Request que mueve la ficha al archivo — para revisión manual antes de fusionar.

  - type: input
    id: post_id
    attributes:
      label: Id de la ficha
      placeholder: "Ej: recogida-issue-12"
    validations:
      required: true

  - type: input
    id: motivo
    attributes:
      label: Motivo (opcional)
      description: Por qué se archiva (adoptado, reclamado por su propietario, trasladado a una protectora...).
      placeholder: "Ej: Adoptado"
    validations:
      required: false
