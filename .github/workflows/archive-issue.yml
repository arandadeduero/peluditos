name: Archivar animal desde issue

# Valida los issues abiertos con la plantilla "🗄️ Archivar animal" (label archivar-animal) y,
# si el id existe en la portada, mueve esa ficha a data/archive/ en una rama nueva y abre un
# Pull Request para revisión manual. No publica nada directamente: solo fusionar el PR a mano
# aplica el cambio.
#
# El cuerpo del issue es texto NO confiable. Por eso se pasa siempre por `env:` a
# scripts/parse-archive-issue.mjs — nunca se interpola en `run:`.

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: archive-issue-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  validate:
    if: contains(github.event.issue.labels.*.name, 'archivar-animal')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: aranda
      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Validar y mover al archivo
        id: parse
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          result="$(node scripts/parse-archive-issue.mjs)"
          echo "$result"
          {
            echo "result<<EOF_PARSE_RESULT"
            echo "$result"
            echo "EOF_PARSE_RESULT"
          } >> "$GITHUB_OUTPUT"

      - name: Comentar validación fallida
        if: ${{ !fromJSON(steps.parse.outputs.result).ok }}
        env:
          RESULT: ${{ steps.parse.outputs.result }}
        run: |
          node -e '
            const r = JSON.parse(process.env.RESULT);
            const lines = [
              "Este issue tiene datos por corregir antes de poder archivar la ficha:",
              "",
              ...r.errors.map((e) => "- " + e),
              "",
              "Edita el issue con los cambios y se volverá a comprobar automáticamente.",
            ];
            console.log(lines.join("\n"));
          ' > /tmp/comment.md
          gh issue comment "${{ github.event.issue.number }}" --body-file /tmp/comment.md
          gh issue edit "${{ github.event.issue.number }}" --add-label "necesita-cambios" --remove-label "validado" 2>/dev/null || true

      - name: Comprobar si ya hay un PR abierto para este issue
        id: existing_pr
        if: ${{ fromJSON(steps.parse.outputs.result).ok }}
        run: |
          url=$(gh pr list --head "archive-issue-${{ github.event.issue.number }}" --state open --json url --jq '.[0].url // empty')
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Crear rama, commit y Pull Request
        if: ${{ fromJSON(steps.parse.outputs.result).ok && steps.existing_pr.outputs.url == '' }}
        env:
          RESULT: ${{ steps.parse.outputs.result }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          POST_ID=$(node -e 'console.log(JSON.parse(process.env.RESULT).postId)')
          SHELTER=$(node -e 'console.log(JSON.parse(process.env.RESULT).shelter)')
          YEAR=$(node -e 'console.log(JSON.parse(process.env.RESULT).year)')
          BRANCH="archive-issue-${ISSUE_NUMBER}"

          git config user.name "peluditos-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add data/posts.json data/archive
          git commit -m "Archivar ficha ${POST_ID} (issue #${ISSUE_NUMBER})"
          git push -u origin "$BRANCH" --force

          {
            echo "Archiva la ficha \`${POST_ID}\` (${SHELTER}, año ${YEAR}) a partir del issue #${ISSUE_NUMBER}."
            echo ""
            echo "Revisa el cambio antes de fusionar. Al fusionar este PR la ficha se moverá al archivo y el issue se cerrará solo."
            echo ""
            echo "Closes #${ISSUE_NUMBER}"
          } > /tmp/pr-body.md
          gh pr create --base aranda --head "$BRANCH" --title "Archivar ficha: issue #${ISSUE_NUMBER}" --body-file /tmp/pr-body.md
          gh issue edit "$ISSUE_NUMBER" --add-label "validado" --add-label "pr-abierto" --remove-label "necesita-cambios" 2>/dev/null || true

      - name: Avisar del PR creado
        if: ${{ fromJSON(steps.parse.outputs.result).ok && steps.existing_pr.outputs.url == '' }}
        run: |
          pr_url=$(gh pr list --head "archive-issue-${{ github.event.issue.number }}" --state open --json url --jq '.[0].url')
          gh issue comment "${{ github.event.issue.number }}" --body "✅ Ficha encontrada. Se ha abierto ${pr_url} — cuando se revise y fusione, se archivará y este issue se cerrará solo."

      - name: Avisar de que ya hay un PR abierto
        if: ${{ fromJSON(steps.parse.outputs.result).ok && steps.existing_pr.outputs.url != '' }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "Ya hay un Pull Request abierto para este issue: ${{ steps.existing_pr.outputs.url }}. Si has cambiado algo importante, pide a quien lo vaya a revisar que actualice el PR a mano, o ciérralo y vuelve a editar este issue para generar uno nuevo."
